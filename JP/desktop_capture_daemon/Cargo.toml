[package]
name = "desktop_capture_daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["clock"] }
half = "2.4"
image = "0.25"
img_hash = "3.2"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1.48", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
trayicon = "0.4.0"
windows-capture = "2.0.0-alpha.7"
winit = "0.30"
